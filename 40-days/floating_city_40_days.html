<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>浮城四十日 · World Tour</title>
  <style>
    :root {
      --bg: #111827;
      --panel: #1f2937;
      --panel2: #0f172a;
      --text: #f9fafb;
      --muted: #cbd5e1;
      --line: #334155;
      --accent: #facc15;
      --danger: #fb7185;
      --good: #86efac;
      --blue: #93c5fd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at top, #334155 0%, #0f172a 62%, #020617 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      min-height: 100vh;
    }
    .app {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0 0 6px 0;
      font-size: 30px;
      letter-spacing: .5px;
    }
    .subtitle {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }
    .topButtons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    button {
      border: 1px solid #475569;
      background: #1e293b;
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: transform .05s ease, background .15s ease;
    }
    button:hover { background: #334155; }
    button:active { transform: translateY(1px); }
    button.primary {
      background: var(--accent);
      color: #111827;
      border-color: #eab308;
    }
    button.danger {

      border-color: #991b1b;
    }
    button.good {

      border-color: #047857;
    }
    button:disabled {

    }
    .grid {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 14px;
    }
    .panel {
      background: rgba(15, 23, 42, .84);
      border: 1px solid rgba(148, 163, 184, .28);

      padding: 14px;

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .stat {
      background: rgba(30, 41, 59, .8);
      border: 1px solid rgba(148, 163, 184, .18);
      border-radius: 12px;
      padding: 10px;
    }
    .label {

    .value.blueText { color: var(--blue); }
    .sectionTitle {
      font-weight: 900;
      font-size: 17px;
      margin: 4px 0 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .small {
      color: #94a3b8;
      font-size: 12px;
      font-weight: 500;
    }
    .map {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .marketTable {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 12px;
    }
    th, td {
      border-bottom: 1px solid rgba(148, 163, 184, .18);
      padding: 9px 8px;
      text-align: left;
      font-size: 14px;
      vertical-align: middle;
    }
    th {
      color: #cbd5e1;
      background: rgba(30, 41, 59, .8);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .4px;
    }
    tr:hover td { background: rgba(30, 41, 59, .34); }
    .actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

      overflow-y: auto;
      background: rgba(2, 6, 23, .52);
      border: 1px solid rgba(148, 163, 184, .18);
      border-radius: 12px;
      padding: 10px;
      line-height: 1.45;
      font-size: 13px;
    }
    .log p {
      margin: 0 0 8px;
      color: #e2e8f0;
    }
    .inventory {
      margin-top: 10px;
      display: grid;
      gap: 6px;
      color: #e2e8f0;
      font-size: 13px;
    }
    .bar {
      height: 10px;
      border-radius: 999px;
      background: #334155;
      overflow: hidden;
      margin-top: 6px;
    }
    .barFill {
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #eab308, #ef4444);
      width: 0%;
    }
    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(2, 6, 23, .72);
      z-index: 10;
      padding: 18px;

    .modal.show { display: flex; }
    .modalCard {

      border: 1px solid #475569;
      border-radius: 18px;
      padding: 22px;
      text-align: center;

    .modalCard h2 {
      margin-top: 0;
      font-size: 28px;
    }
    .modalCard p {
      color: #cbd5e1;
      line-height: 1.55;
    }
    .hidden { display: none !important; }
    input[type="number"] {
      width: 100%;
      background: #020617;
      color: white;
      border: 1px solid #475569;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 16px;
      margin: 10px 0;
    }
    .tradeBtns {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .hint {

      color: #94a3b8;
      font-size: 12px;
      line-height: 1.4;
    }

      .topButtons { justify-content: flex-start; }
      .marketTable th:nth-child(3), .marketTable td:nth-child(3) { display: none; }
      th, td { padding: 8px 5px; font-size: 13px; }
      button { padding: 9px 10px; font-size: 13px; }
      h1 { font-size: 26px; }
    }
  
    html { color-scheme: dark; }
    body { min-height: 100dvh; }
    .app { width: 100%; padding: clamp(10px, 2vw, 24px); }
    .grid { grid-template-columns: minmax(260px, 320px) minmax(0, 1fr); align-items: start; }
    .grid > *, .stat, header > *, .marketCard > * { min-width: 0; }
    button { min-height: 44px; touch-action: manipulation; overflow-wrap: anywhere; }

    header > div:first-child { flex: 1 1 300px; }

    .marketList { display: grid; gap: 8px; }

    .log { height: 230px; }
    .value { overflow-wrap: anywhere; word-break: normal; }
    @media (max-width: 900px) {

    }

      .actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

    .mobileHeader, .mobileDock, .marketPager, .shortName { display: none; }
    .itemIcon { display: inline; }
    .mobileStatus > summary, .gameMenu > summary { cursor: pointer; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    .tradeQuantityButtons { display: flex; gap: 8px; margin-bottom: 14px; }

function openModal(kind) {

function localBoardEntries() {

    if (!Array.isArray(rows) || !rows.every(r => r && typeof r.runId === 'string' && typeof r.name === 'string' && r.name.length <= 24 && Number.isSafeInteger(r.score) && typeof r.date === 'string' && Number.isFinite(Date.parse(r.date)))) throw Error('board');

  } catch (_) { return null; }
}

function boardHtml() {

async function leaderboardRequest(path, options = {}) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 12000);
  try {
    const response = await fetch(`${LEADERBOARD_API}${path}`, { ...options, signal: controller.signal, credentials: 'omit' });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
    return data;
  } finally { clearTimeout(timer); }
}
function renderBoardPreservingInput() {
  if (!['board', 'ending'].includes(modal)) return;
  const input = $('playerName'), value = input?.value, focused = document.activeElement === input;
  renderModal();
  if ($('playerName') && value !== undefined) { $('playerName').value = value; if (focused) $('playerName').focus({preventScroll:true}); }
}
async function refreshLeaderboard() {
  const request = ++sharedRequest, runId = state.runId;
  sharedStatus = 'loading'; renderBoardPreservingInput();
  try {
    const data = await leaderboardRequest(`/api/leaderboard?runId=${encodeURIComponent(runId)}`);
    if (request !== sharedRequest) return;
    if (!Array.isArray(data.entries) || !data.entries.every(r => r && typeof r.runId === 'string' && typeof r.name === 'string' && Number.isSafeInteger(r.score) && Number.isFinite(Date.parse(r.date)))) throw Error('Invalid board');
    sharedRows = data.entries; sharedStatus = 'ready';
    sharedRecordedRun = data.recorded ? runId : null;
  } catch (_) { if (request === sharedRequest) sharedStatus = 'error'; }
  if (request === sharedRequest) renderBoardPreservingInput();
}
function runToken(runId) {
  if (runTokens.has(runId)) return runTokens.get(runId);
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem('floating_city_score_tokens') || '{}'); } catch (_) {}
  let token = saved?.[runId];
  if (typeof token !== 'string' || !/^[a-f0-9]{64}$/.test(token)) token = Array.from(crypto.getRandomValues(new Uint8Array(32)), n => n.toString(16).padStart(2, '0')).join('');
  runTokens.set(runId, token);
  try { localStorage.setItem('floating_city_score_tokens', JSON.stringify(Object.fromEntries([...Object.entries(saved || {}).slice(-49), [runId, token]]))); } catch (_) {}
  return token;
}

}

}
function tradeLimit(type, i) {
  return type === 'buy' ? Math.max(0, Math.min(Math.floor(state.cash / state.prices[i]), Math.floor((state.capacity - usedSpace()) / goods[i].size))) : state.inv[i];
}
function openTrade(type, index) {
  if (state.ended) return;
  currentTrade = { type, index };
  openModal('trade');
}
function doTrade() {
  if (!currentTrade || state.ended) return;
  const qty = Number($('tradeQty').value);
  const { type, index } = currentTrade;
  if (!Number.isSafeInteger(qty) || qty < 1 || qty > tradeLimit(type, index)) return notify('请输入有效的交易数量。', 'Enter a valid trade quantity.');
  const amount = qty * state.prices[index];
  state.cash += type === 'buy' ? -amount : amount;
  state.inv[index] += type === 'buy' ? qty : -qty;
  addLog(`${type === 'buy' ? '买入' : '卖出'} ${qty} 件${goods[index].name[0]}，金额 ¥${amount}。`, `${type === 'buy' ? 'Bought' : 'Sold'} ${qty} ${goods[index].name[1]} for ¥${amount}.`);
  closeModal(); render();
}
function bankAction(type) {
  if (state.ended) return;
  const max = type === 'deposit' ? state.cash : type === 'withdraw' ? state.bank : Math.min(state.cash, state.debt);
  const labels = { deposit: ['存银行', 'Deposit'], withdraw: ['取银行', 'Withdraw'], repay: ['还债', 'Repay debt'] };
  const raw = prompt(`${t(...labels[type])} · ${t('最多', 'Maximum')} ${money(max)}`, max);
  if (raw === null) return;
  const amount = Number(raw);
  if (!Number.isSafeInteger(amount) || amount < 1 || amount > max) return notify('请输入范围内的正整数。', 'Enter a positive whole amount within the limit.');
  if (type === 'deposit') { state.cash -= amount; state.bank += amount; }
  else if (type === 'withdraw') { state.bank -= amount; state.cash += amount; }
  else { state.cash -= amount; state.debt -= amount; }
  addLog(`${labels[type][0]} ¥${amount}。`, `${labels[type][1]}: ¥${amount}.`);
  render();
}
function buyHome(index) {
  if (state.ended || !homes[index] || index <= state.home) return;
  const cost = homes[index].price - homes[state.home].price;
  if (state.cash < cost) return notify('现金不足。', 'Not enough cash.');
  state.cash -= cost; state.home = index; state.capacity = homes[index].capacity;
  addLog(`升级为${homes[index].name[0]}，支付差价 ¥${cost}，总仓位 ${state.capacity}。`, `Upgraded to ${homes[index].name[1]} for ¥${cost}; total storage ${state.capacity}.`);
  render(); renderModal();
}
function rollDice() {
  if (state.ended) return;
  const bet = Number($('bet').value);
  if (!Number.isSafeInteger(bet) || bet < 1 || bet > state.cash || !Number.isSafeInteger(state.cash + bet)) return notify('下注必须是现金范围内的正整数。', 'Bet a positive whole amount within your available cash.');
  const roll = rand(1, 6);
  state.cash += roll >= 4 ? bet : -bet;
  lastRoll = { roll, bet };
  addLog(`骰子点数 ${roll}，${roll >= 4 ? '净赚' : '损失'} ¥${bet}。`, `Dice roll ${roll}: ${roll >= 4 ? 'net gain' : 'lost'} ¥${bet}.`);
  render(); renderModal();
}
function workGig() {
  if (state.ended) return;
  const earn = rand(180, 520), loss = rand(4, 9);
  state.cash += earn; state.health -= loss;
  addLog(`接远程零工赚到 ¥${earn}，健康 -${loss}。`, `Remote gig earned ¥${earn}; health -${loss}.`);
  nextDay();
}
function rest() {
  if (state.ended) return;
  const gain = rand(10, 18);
  state.health = Math.min(100, state.health + gain);
  addLog(`休息恢复健康 +${gain}（最高100）。`, `Rest restored ${gain} health (up to 100).`);
  nextDay();
}
function travel(index) {
  if (state.ended || !locations[index] || index === state.location) return;
  state.location = index;
  addLog(`抵达${locations[index].name[0]}。`, `Arrived in ${locations[index].name[1]}.`);
  nextDay();
}
function nextDay() {
  if (state.ended) return;
  state.bank = Math.floor(state.bank * 1.02); state.debt = Math.floor(state.debt * 1.1);
  let shock = null;
  if (Math.random() < .52) {
    const event = rand(0, 7);
    const messages = [
      ['长途旅行让你疲惫，健康 -6。', 'Long journeys take their toll. Health -6.'],
      ['直播带货佣金到账，现金 +300。', 'A livestream commission arrives. Cash +300.'],
      ['遭遇交易诈骗，现金损失15%。', 'A trading scam costs 15% of your cash.'],
      ['熬夜盯盘，健康 -10。', 'Late-night market watching. Health -10.'],
      ['收到平台返现，现金 +120。', 'A marketplace cashback arrives. Cash +120.'],
      ['物流费用超支，现金最多 -500。', 'Unexpected shipping costs. Lose up to ¥500.'],
      ['今天精神不错，健康 +5。', 'Feeling refreshed. Health +5.'],
      ['热搜引发行情波动。', 'A viral trend shakes the market.']
    ];
    if (event === 0) state.health -= 6;
    if (event === 1) state.cash += 300;
    if (event === 2) state.cash = Math.floor(state.cash * .85);
    if (event === 3) state.health -= 10;
    if (event === 4) state.cash += 120;
    if (event === 5) state.cash = Math.max(0, state.cash - 500);
    if (event === 6) state.health += 5;
    if (event === 7) shock = { index: rand(0, goods.length - 1), factor: Math.random() < .5 ? 2.8 : .25 };
    addLog(...messages[event]);
  }
  state.health = Math.max(0, Math.min(100, state.health));
  if (state.health === 0) return endGame('health');
  if (state.day === 40) return endGame('time');
  state.day++; generatePrices(shock); render();
}
function endGame(reason) {
  if (state.ended) return;
  state.inv.forEach((qty, i) => { state.cash += qty * state.prices[i]; state.inv[i] = 0; });
  if (state.cash + state.bank >= state.debt) {
    const cashPay = Math.min(state.cash, state.debt);
    state.cash -= cashPay; state.debt -= cashPay;
    state.bank -= state.debt; state.debt = 0;
  }
  state.ended = true; state.endReason = reason;
  closeModal();
  addLog(`旅程结束，最终净资产 ¥${netWorth()}。`, `Journey ended. Final net worth: ¥${netWorth()}.`);
  render(); openModal('ending');
}
async function submitScore() {
  if (!state.ended || submittingScore) return;
  const name = $('playerName').value.trim();
  if (!name || name.length > 24 || /[\u0000-\u001f\u007f]/u.test(name)) return notify('请输入1至24字符的名称。', 'Enter a name between 1 and 24 characters.');
  const run = JSON.parse(JSON.stringify(state));
  const token = runToken(run.runId);
  submittingScore = true; renderBoardPreservingInput();
  try {
    await leaderboardRequest('/api/runs', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({runId:run.runId, token})});
    const final = {cash:run.cash,bank:run.bank,debt:run.debt,home:run.home,day:run.day,health:run.health,ended:run.ended,endReason:run.endReason,inventoryEmpty:run.inv.every(n => n === 0)};
    const data = await leaderboardRequest('/api/leaderboard', {method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`}, body:JSON.stringify({runId:run.runId,name,final})});
    if (!data.ok || data.entry?.runId !== run.runId) throw Error('Invalid response');
    if (state.runId === run.runId) { state.submitted = true; sharedRecordedRun = run.runId; }
    try {
      const rows = localBoardEntries() || [];
      if (!rows.some(r => r.runId === run.runId)) rows.push(data.entry);
      localStorage.setItem(BOARD_KEY, JSON.stringify(rows));
      if (state.runId === run.runId) localStorage.setItem(SAVE_KEY, JSON.stringify(saveEnvelope()));
    } catch (_) {}
    notify('成绩已发布，所有玩家都能看到！', 'Score published for everyone to see!');
    await refreshLeaderboard();
  } catch (_) {
    notify('成绩尚未发布。请检查网络并重试，或保存游戏文件稍后继续。', 'Score not published. Check your connection and retry, or save your game file for later.');
  } finally { submittingScore = false; renderBoardPreservingInput(); }
}

function saveEnvelope() {
  return { game: 'floating-city-40-days', version: VERSION, savedAt: new Date().toISOString(), language: lang, goods: goods.map(g => g.id), cities: locations.map(l => l.id), state };
}
async function saveGame() {
  const text = JSON.stringify(saveEnvelope(), null, 2);
  let browserSaved = true;
  try { localStorage.setItem(SAVE_KEY, text); } catch (_) { browserSaved = false; }
  const filename = `floating-city-day-${state.day}-${new Date().toISOString().slice(0, 10)}.json`;
  try {
    if (typeof window.showSaveFilePicker === 'function') {
      const handle = await window.showSaveFilePicker({ suggestedName: filename, types: [{ description: 'Game save JSON', accept: { 'application/json': ['.json'] } }] });
      const writable = await handle.createWritable();
      await writable.write(text); await writable.close();
      notify('存档文件已保存。', 'Save file written.');
    } else {
      const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      notify('已请求下载存档，请在浏览器下载位置查找。', 'Save download requested. Check your browser’s downloads.');
    }
  } catch (error) {
    if (error.name === 'AbortError') notify(browserSaved ? '文件保存已取消，浏览器副本已保留。' : '文件保存已取消，浏览器副本也未保存。', browserSaved ? 'File save canceled. A browser copy was kept.' : 'File save canceled. No browser copy was saved.');
    else notify(browserSaved ? '文件保存失败，浏览器副本已保留。' : '保存失败，请重试。', browserSaved ? 'File save failed. A browser copy was kept.' : 'Saving failed. Please retry.');
  }
  if (!browserSaved) notify('浏览器副本未保存，请保留下载的存档文件。', 'Browser backup unavailable. Keep your downloaded save file.');
}
function loadGame() { $('saveFile').value = ''; $('saveFile').click(); }
function validateState(value) {
  if (!value || typeof value !== 'object' || Array.isArray(value)) throw Error('state');
  const integer = (n, min, max) => Number.isSafeInteger(n) && n >= min && n <= max;
  if (typeof value.runId !== 'string' || !/^[a-zA-Z0-9-]{1,100}$/.test(value.runId)) throw Error('runId');
  if (!integer(value.day, 1, 40) || !integer(value.health, 0, 100) || !integer(value.home, 0, homes.length - 1) || !integer(value.location, 0, locations.length - 1)) throw Error('range');
  for (const key of ['cash', 'bank', 'debt']) if (!integer(value[key], 0, Number.MAX_SAFE_INTEGER)) throw Error(key);
  if (!integer(value.capacity, 100, 1600) || value.capacity !== homes[value.home].capacity) throw Error('capacity');
  if (!Array.isArray(value.inv) || value.inv.length !== goods.length || !value.inv.every(n => integer(n, 0, 1600)) || usedSpace(value) > value.capacity) throw Error('inventory');
  if (!Array.isArray(value.prices) || value.prices.length !== goods.length || !value.prices.every(n => integer(n, 1, 1000000))) throw Error('prices');
  if (typeof value.ended !== 'boolean' || typeof value.submitted !== 'boolean' || ![null, 'time', 'health'].includes(value.endReason)) throw Error('ending');
  if (value.ended !== (value.endReason !== null) || (!value.ended && (value.health === 0 || value.submitted)) || (value.endReason === 'health' && value.health !== 0) || (value.endReason === 'time' && value.day !== 40) || (value.ended && value.inv.some(Boolean))) throw Error('ending consistency');
  if (!(integer(value.news, 0, 2) || (value.news && typeof value.news === 'object' && integer(value.news.index, 0, goods.length - 1) && typeof value.news.up === 'boolean'))) throw Error('news');
  if (!Array.isArray(value.log) || value.log.length > 80 || !value.log.every(r => r && integer(r.day, 1, 40) && typeof r.zh === 'string' && typeof r.en === 'string' && r.zh.length <= 2000 && r.en.length <= 2000)) throw Error('log');
  // Reconstruct only documented fields, dropping unknown input keys.
  return Object.fromEntries(['runId', 'day', 'cash', 'bank', 'debt', 'health', 'home', 'capacity', 'location', 'prices', 'inv', 'log', 'news', 'ended', 'endReason', 'submitted'].map(key => [key, value[key]]));
}
function migrateLegacy(old) {
  const integer = (n, min, max) => Number.isSafeInteger(n) && n >= min && n <= max;
  if (!old || !integer(old.day, 1, 41) || !integer(old.roomLevel, 0, 4) || !integer(old.location, 0, 6) || ![100,120,150,200,280].includes(old.capacity) || typeof old.ended !== 'boolean' || !Array.isArray(old.log) || !old.log.every(s => typeof s === 'string')) throw Error('legacy');
  const home = [0, 1, 2, 3, 4][old.roomLevel];
  // Map old locations explicitly; there is no claim that the cities are equivalent.
  const location = [0, 5, 3, 4, 2, 1, 6][old.location];
  const migrated = { ...old, runId: uid(), day: Math.min(old.day, 40), home, capacity: homes[home].capacity, location, news: 0, endReason: old.ended ? (old.health <= 0 ? 'health' : 'time') : null, submitted: false, log: old.log.slice(0, 79).map(text => ({ day: Math.min(old.day, 40), zh: `[旧存档] ${text}`, en: `[Legacy save, original text] ${text}` })) };
  if (old.ended && migrated.endReason === 'time') migrated.day = 40;
  return validateState(migrated);
}
function applySave(data) {
  let next, legacy = false;
  if (data?.game === 'floating-city-40-days') {
    if (data.version !== VERSION || JSON.stringify(data.goods) !== JSON.stringify(goods.map(g => g.id)) || JSON.stringify(data.cities) !== JSON.stringify(locations.map(l => l.id))) throw Error('version');
    next = validateState(data.state);
  } else {
    legacy = true; next = migrateLegacy(data);
  }
  if (!confirm(legacy ? t('将转换旧版存档：旧商品按顺序替换为新商品，地点映射到世界城市，住所升级为新房产。现金、银行、债务和库存数量保留。继续并替换当前进度吗？', 'Convert this legacy save? Goods are replaced by position, locations mapped to world cities and housing converted. Cash, bank, debt and inventory quantities are preserved. Replace your current progress?') : t('读取此存档并替换当前进度？', 'Load this save and replace your current progress?'))) return;
  closeModal(); state = next;
  if (legacy) addLog('旧版存档已转换为环球版本。', 'Legacy save converted to the world-tour edition.');
  if (!legacy && ['zh', 'en'].includes(data.language)) lang = data.language;
  render(); if (state.ended) openModal('ending');
  notify('存档已读取。', 'Save loaded.');
}
function loadBrowserSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return notify('没有浏览器存档，请选择本地文件。', 'No browser save. Choose a local save file.');
    applySave(JSON.parse(raw));
  } catch (_) { notify('存档无效或存储不可用，当前进度未被替换。', 'Invalid save or unavailable storage. Your current progress was preserved.'); }
}
$('saveFile').addEventListener('change', async event => {
  const file = event.target.files[0];
  if (!file) return;
  try {
    if (file.size > 1000000) throw Error('size');
    applySave(JSON.parse(await file.text()));
  } catch (_) { notify('无法读取此存档，当前进度未被替换。', 'Could not read this save. Your current progress was preserved.'); }
});
$('dialog').addEventListener('close', () => { if (!$('dialog').open) { modal = null; currentTrade = null; lastRoll = null; } });
$('dialog').addEventListener('cancel', event => { event.preventDefault(); closeModal(); });
document.addEventListener('keydown', event => {
  if (event.target.closest('input, textarea, select, [contenteditable]') || event.ctrlKey || event.metaKey || event.altKey || event.repeat) return;
  if (event.key.toLowerCase() === 's') { event.preventDefault(); saveGame(); }
});
let resizeFrame;
function resizeGame() {
  document.documentElement.style.setProperty('--app-height', `${visualViewport?.height || innerHeight}px`);
  document.documentElement.style.setProperty('--viewport-offset', `${visualViewport?.offsetTop || 0}px`);
  cancelAnimationFrame(resizeFrame);
  resizeFrame = requestAnimationFrame(() => { if (state) render(); });
}
window.addEventListener('resize', resizeGame);
window.visualViewport?.addEventListener('resize', resizeGame);
window.visualViewport?.addEventListener('scroll', resizeGame);
resizeGame();
newGame(false);
openModal('intro');

  </script>
